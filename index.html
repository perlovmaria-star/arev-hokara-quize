<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  const QUESTIONS = [
    { q: "כמה ילדים יש לך?", opts: ["1","2","4 ומעלה","6 ומעלה (את כבר מנהלת מוסד חינוכי)"], correct: 3 },
    { q: "כמה ימי מילואים כבר ספגת?", opts: ["עד 100","100-250","250-500","כבר הפסקתי לחשב. תעדכנו כשהמלחמה נגמרת"], correct: 3 },
    { q: "מה מצבך עם קרן הסיוע?", opts: ["לא הגשתי","הגשתי פעם אחת והתייאשתי","הגשתי את כל מה שמגיע לי ומחכה לתשובה","הגשתי, קיבלתי, ועכשיו אני מסבירה לאחרות איך להגיש"], correct: 3 },
    { q: "יש לך עזרה מההורים?", opts: ["כן, בלעדיהם לא הייתי שורדת","עוזרים כשאפשר","יש עזרה, אבל עם ריבית רגשית","אמא שלי מתקשרת לשאול אם אני יכולה לעזור להם"], correct: 3 },
    { q: 'כמה פעמים אמרת השבוע "עזבי, אני אעשה את זה לבד"?', opts: ["פעם","כמה פעמים","כמעט כל יום","זו כבר לא אמירה. זו תוכנית עבודה"], correct: 3 },
    { q: 'כמה פעמים שמעת את המשפט "אבל אתם כבר גרושים..."?', opts: ["פעם אחת","כמה פעמים","יותר מדי פעמים","אם הייתי מקבלת שקל על כל פעם, לא הייתי צריכה קרן סיוע"], correct: 3 },
    { q: 'כמה פעמים הסברת למישהו מה זה בכלל "גרושה של מילואימניק"?', opts: ["פעם אחת","כמה פעמים","איבדתי ספירה","אני כבר יכולה להעביר על זה הרצאה"], correct: 3 },
    { q: 'כמה פעמים אמרת השנה "אין לי כוח"?', opts: ["פעם-פעמיים","פעם בשבוע","כמעט כל יום","זו כבר לא תחושה. זו זהות"], correct: 3 },
    { q: "כמה פעמים פתחת את הטלפון כדי לבדוק אם נכנס כסף?", opts: ["פעם ביום","כמה פעמים ביום","כל פעם שיש התראה","אני כבר יודעת לזהות את האפליקציה לפי הצליל"], correct: 3 },
    { q: "מה הכי מלחיץ אותך?", opts: ["הטלפון מהגן","הודעה מבית הספר","הודעה מהבנק","שלוש נקודות בוואטסאפ מגרושך..."], correct: 3 },
    { q: "מה הדבר הראשון שאת עושה כשמתפנה לך שעה?", opts: ["ישנה","מקפלת כביסה","משלימה סידורים","מבזבזת רבע שעה על להחליט במה להתחיל"], correct: 3 },
    { q: 'כמה פעמים אמרת "יהיה בסדר" כשלא היה לך מושג איך יהיה?', opts: ["פעם","כמה פעמים","כל שבוע","זו תוכנית העבודה שלי מאז 7 באוקטובר"], correct: 3 },
  ];
  const HOST_PIN = '2026';
  // Paste the Google Apps Script Web App URL here after deploying it (see deployment instructions):
  const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzSHmbecOsJ7S5lNi_Xf2tPfjmJAIZ0bJjYg0e0LlEVxYqesyZx3J2ms_nmhCqugZCH/exec';
  const QUESTION_SECONDS = 20;
  const FEEDBACK_MS = 700;
  const root = document.getElementById('quiz-root');
  let state = {
    view: 'welcome', name: '', playerId: '',
    qIndex: 0, correctCount: 0, quizStartAt: 0, questionStartAt: 0, selectedIdx: null, locked: false,
    qTimer: null, players: [], presenterIndex: 0
  };

  function uid(){ return 'p' + Math.random().toString(36).slice(2,10); }
  function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtTime(ms){ return (ms/1000).toFixed(1) + ' שנ׳'; }

  function sheetsConfigured(){ return /^https:\/\//.test(SHEETS_URL); }

  function fetchTimeout(url, options, ms){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms || 3000);
    return fetch(url, Object.assign({}, options, { signal: controller.signal })).finally(() => clearTimeout(timer));
  }

  async function apiPost(payload){
    if (!sheetsConfigured()) return false;
    try {
      // Apps Script POST responses go through a redirect whose body browsers
      // often can't read due to CORS, even when the write itself succeeds.
      // Fire the write with no-cors (can't read the response) and verify
      // success separately via a GET re-fetch.
      await fetchTimeout(SHEETS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }, 3000);
      return true;
    } catch(e){ return false; }
  }

  async function apiVerifyPlayer(pid, expected){
    for (let attempt = 0; attempt < 3; attempt++){
      await new Promise(r => setTimeout(r, 500));
      const players = await apiGetPlayers();
      const found = players.find(p => p.playerId === pid);
      if (found &&
          Number(found.correctCount) === expected.correctCount &&
          (found.finished === true || found.finished === 'true' || found.finished === 'TRUE') === expected.finished){
        return true;
      }
    }
    return false;
  }

  async function apiGetPlayers(){
    if (!sheetsConfigured()) return [];
    try {
      const res = await fetchTimeout(SHEETS_URL + '?t=' + Date.now(), {}, 5000);
      const data = await res.json();
      return (data && data.players) ? data.players : [];
    } catch(e){ return null; }
  }

  async function setPlayer(pid, data){
    await apiPost({ action: 'upsert', playerId: pid, name: data.name, correctCount: data.correctCount, totalTimeMs: data.totalTimeMs, finished: data.finished, joinedAt: data.joinedAt });
  }

  async function getAllPlayers(){
    const raw = await apiGetPlayers();
    if (raw === null) return null;
    const out = raw.map(p => ({
      name: p.name,
      correctCount: Number(p.correctCount) || 0,
      totalTimeMs: Number(p.totalTimeMs) || 0,
      finished: (p.finished === true || p.finished === 'true' || p.finished === 'TRUE'),
      joinedAt: Number(p.joinedAt) || 0
    }));
    out.sort((a,b) => {
      const af = a.finished ? 1 : 0, bf = b.finished ? 1 : 0;
      if (af !== bf) return bf - af;
      if (a.correctCount !== b.correctCount) return (b.correctCount||0) - (a.correctCount||0);
      return (a.totalTimeMs||Infinity) - (b.totalTimeMs||Infinity);
    });
    return out;
  }

  function render(){ root.innerHTML = ''; const el = SCREENS[state.view] ? SCREENS[state.view]() : SCREENS.welcome(); root.appendChild(el); }
  function h(tag, attrs, children){
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs){
      if (k === 'class') el.className = attrs[k];
      else if (k === 'style') el.setAttribute('style', attrs[k]);
      else if (k === 'html') el.innerHTML = attrs[k];
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(c => { if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }

  async function checkStorageHealth(){
    if (!sheetsConfigured()) return false;
    try {
      const res = await fetch(SHEETS_URL + '?t=' + Date.now());
      const data = await res.json();
      return !!(data && Array.isArray(data.players));
    } catch(e){ return false; }
  }

  function clearQTimer(){ if (state.qTimer){ clearInterval(state.qTimer); state.qTimer = null; } }

  function spawnConfetti(container){
    const colors = ['#FFEAA5', '#f0a8c4', '#c9a0dc', '#fbf3fa', '#7a3b82'];
    for (let i = 0; i < 44; i++){
      const piece = document.createElement('div');
      piece.className = 'qz-confetti-piece';
      const size = 6 + Math.random()*6;
      const isRound = Math.random() > 0.5;
      piece.style.width = size + 'px';
      piece.style.height = (isRound ? size : size*1.6) + 'px';
      piece.style.borderRadius = isRound ? '50%' : '2px';
      piece.style.left = (Math.random()*100) + '%';
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDuration = (3.2 + Math.random()*2.2) + 's';
      piece.style.animationDelay = (Math.random()*0.7) + 's';
      container.appendChild(piece);
    }
  }

  // ---------- LANDING: game explanation (no QR here — QR lives in a separate slide) ----------
  // ---------- SCREEN 1: QR ----------
  // ---------- SCREEN 0: WELCOME (forum logo + event welcome) ----------
  function ScreenWelcome(){
    const wrap = h('div', {class:'qz-screen'});
    wrap.appendChild(h('img', {src:'./Forumlogo.png', alt:'פורום נשות המילואימניקים', style:'width:72px; height:72px; border-radius:50%; box-shadow:0 6px 20px rgba(0,0,0,0.3); margin-bottom:2px;'}));
    wrap.appendChild(h('div', {class:'qz-welcome-headline qz-font-display'}, ['ערב הוקרה']));
    wrap.appendChild(h('div', {style:'color: var(--cream); font-family:"Assistant",sans-serif; font-weight:300; font-size:26px; margin-top:-6px;'}, ['עבור']));
    wrap.appendChild(h('div', {class:'qz-welcome-badge', style:'margin-top:-10px;'}, ['פרודות | גרושות המילואימניקים']));
    wrap.appendChild(h('button', {class:'qz-btn-plain-white', onclick: () => { state.view='qr'; render(); }}, ['מתחילים']));
    return wrap;
  }

  // ---------- SCREEN 1: QR ----------
  function ScreenQR(){
    const wrap = h('div', {class:'qz-screen'});
    wrap.appendChild(h('div', {class:'qz-ring-wrap'}, [
      h('div', {class:'qz-ring-glow'}),
      h('div', {class:'qz-font-display qz-heartbeat', style:'font-size:42px; z-index:1;'}, ['🩷'])
    ]));
    wrap.appendChild(h('div', {class:'qz-eyebrow'}, ['משחק פתיחה קהילתי']));
    wrap.appendChild(h('div', {class:'qz-title-main qz-font-display'}, ['מי באמת מבינה את החיים שלנו?']));

    const qrBox = h('div', {class:'qz-qr-box', id:'qz-qr-box'});
    wrap.appendChild(qrBox);
    wrap.appendChild(h('div', {class:'qz-qr-hint'}, ['📱 סרקו כדי להצטרף למשחק מהטלפון שלכן']));
    setTimeout(drawQr, 0);

    wrap.appendChild(h('button', {class:'qz-btn', onclick: () => { state.view='start'; render(); }}, ['הבאה']));
    return wrap;
  }

  // ---------- SCREEN 2: START OF THE GAME ----------
  function ScreenStart(){
    const wrap = h('div', {class:'qz-screen'});
    wrap.appendChild(h('div', {class:'qz-eyebrow'}, ['לפני שמתחילים']));
    wrap.appendChild(h('div', {class:'qz-title-main qz-font-display'}, ['הוראות המשחק']));

    const step1 = h('div', {class:'qz-instr-step'});
    step1.appendChild(h('div', {class:'qz-instr-num'}, ['1']));
    step1.appendChild(h('div', {class:'qz-instr-text'}, ['נרשמים למשחק עם השם המלא שלך.']));
    wrap.appendChild(step1);

    const step2 = h('div', {class:'qz-instr-step'});
    step2.appendChild(h('div', {class:'qz-instr-num'}, ['2']));
    step2.appendChild(h('div', {class:'qz-instr-text'}, ['לכל שאלה יש 20 שניות בדיוק לענות. אם הזמן נגמר בלי בחירה, המשחק ממשיך אוטומטית לשאלה הבאה.']));
    wrap.appendChild(step2);

    wrap.appendChild(h('button', {class:'qz-btn', onclick: () => { state.view='name'; render(); }}, ['בואי נתחיל']));
    wrap.appendChild(h('button', {class:'qz-reset-link', onclick: () => { state.presenterIndex = 0; state.view='presenter'; render(); }}, ['🎤 מצב מנחה — הקראת שאלות']));
    wrap.appendChild(h('button', {class:'qz-reset-link', onclick: () => { state.view='host-pin'; render(); }}, ['כניסת מנחה — תוצאות']));
    const warnBox = h('div', {id:'qz-storage-warn'});
    wrap.appendChild(warnBox);
    checkStorageHealth().then(ok => {
      if (!ok && root.querySelector('#qz-storage-warn')){
        root.querySelector('#qz-storage-warn').appendChild(h('div', {class:'qz-warn-banner'}, ['⚠️ אין חיבור לגיליון השמירה כרגע. יכול להיות שהתשובות לא יישמרו. אנא נסי לרענן, ואם זה ממשיך — הודיעי למנחה.']));
      }
    });
    return wrap;
  }

  function drawQr(){
    const box = root.querySelector('#qz-qr-box');
    if (!box || typeof QRCode === 'undefined') return;
    box.innerHTML = '';
    const full = window.location.href.split('?')[0] + '?join=1';
    try {
      new QRCode(box, { text: full, width: 170, height: 170, colorDark: '#241129', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    } catch(e){}
  }

  // ---------- PRESENTER MODE (host's shared screen — reads questions aloud, no scoring/timer) ----------
  function ScreenPresenter(){
    const wrap = h('div', {class:'qz-screen'});
    const idx = state.presenterIndex || 0;

    if (idx === 0){
      wrap.appendChild(h('div', {class:'qz-eyebrow'}, ['מצב מנחה']));
      wrap.appendChild(h('div', {class:'qz-title-main qz-font-display'}, ['מוכנות?']));
      wrap.appendChild(h('div', {class:'qz-subtitle'}, ['כל אחת עונה בטלפון שלה.']));
    } else if (idx <= QUESTIONS.length){
      const q = QUESTIONS[idx-1];
      wrap.appendChild(h('div', {class:'qz-presenter-qnum'}, ['שאלה ' + idx + ' מתוך ' + QUESTIONS.length]));
      wrap.appendChild(h('div', {class:'qz-presenter-text qz-font-display'}, [q.q]));
      const opts = h('div', {class:'qz-presenter-opts'});
      q.opts.forEach(o => opts.appendChild(h('div', {class:'qz-presenter-opt'}, [o])));
      wrap.appendChild(opts);
    } else {
      wrap.appendChild(h('div', {style:'font-size:44px;'}, ['🩷']));
      wrap.appendChild(h('div', {class:'qz-title-main qz-font-display'}, ['זהו, סיימנו!']));
      wrap.appendChild(h('div', {class:'qz-subtitle'}, ['עוברות ללוח התוצאות כדי להכריז על המנצחת']));
    }

    const nav = h('div', {class:'qz-presenter-nav'});
    if (idx > 0){
      nav.appendChild(h('button', {class:'qz-reset-link', onclick: () => { state.presenterIndex -= 1; render(); }}, ['הקודמת']));
    }
    if (idx <= QUESTIONS.length){
      nav.appendChild(h('button', {class:'qz-btn', onclick: () => { state.presenterIndex = idx + 1; render(); }}, [idx === 0 ? 'מעבר לשאלות' : 'הבאה']));
    } else {
      nav.appendChild(h('button', {class:'qz-btn', onclick: () => { state.view='host-pin'; render(); }}, ['🏆 ללוח התוצאות']));
    }
    wrap.appendChild(nav);
    wrap.appendChild(h('button', {class:'qz-reset-link', onclick: () => { state.view='start'; render(); }}, ['יציאה ממצב מנחה']));
    return wrap;
  }

  // ---------- NAME ENTRY ----------
  function ScreenName(){
    const wrap = h('div', {class:'qz-screen'});
    wrap.appendChild(h('div', {class:'qz-eyebrow'}, ['הצטרפות למשחק']));
    wrap.appendChild(h('div', {class:'qz-title-main qz-font-display', style:'font-size:22px;'}, ['מה שמך המלא?']));
    const nameInput = h('input', {class:'qz-input', placeholder:'שם מלא'});
    wrap.appendChild(nameInput);
    const err = h('div', {class:'qz-error'});
    wrap.appendChild(err);
    wrap.appendChild(h('button', {class:'qz-btn', onclick: async () => {
      const name = nameInput.value.trim();
      if (!name){ err.textContent = 'נא להזין שם'; return; }
      const pid = uid();
      state.playerId = pid; state.name = name;
      state.qIndex = 0; state.correctCount = 0; state.selectedIdx = null; state.locked = false;
      state.quizStartAt = Date.now();
      state.view = 'question'; render();
      setPlayer(pid, { name, correctCount: 0, totalTimeMs: 0, finished: false, joinedAt: Date.now() });
    }}, ['התחילי לשחק']));
    wrap.appendChild(h('button', {class:'qz-reset-link', onclick: () => { state.view='start'; render(); }}, ['חזרה']));
    setTimeout(() => nameInput.focus(), 50);
    return wrap;
  }

  // ---------- QUESTION: self-paced, 10s timer centered ----------
  function ScreenQuestion(){
    const qi = state.qIndex;
    const q = QUESTIONS[qi];
    const wrap = h('div', {class:'qz-screen'});

    const circumference = 2 * Math.PI * 33;
    const timerHtml = '<div class="qz-timer-mid" id="qz-qtimer"><svg width="78" height="78" viewBox="0 0 78 78"><circle class="qz-timer-bg" cx="39" cy="39" r="33"/><circle class="qz-timer-fg" cx="39" cy="39" r="33" style="stroke-dasharray:'+circumference+'; stroke-dashoffset:0;"/></svg><div class="qz-timer-num" id="qz-qtimer-num">'+QUESTION_SECONDS+'</div></div>';
    wrap.appendChild(h('div', {html: timerHtml}));
    wrap.appendChild(h('div', {class:'qz-qnum'}, ['שאלה ' + (qi+1) + ' מתוך ' + QUESTIONS.length]));
    const track = h('div', {class:'qz-progress-track'});
    track.appendChild(h('div', {class:'qz-progress-fill', style:'width:' + Math.round((qi/QUESTIONS.length)*100) + '%;'}));
    wrap.appendChild(track);
    wrap.appendChild(h('div', {class:'qz-question-text qz-font-display'}, [q.q]));
    const opts = h('div', {class:'qz-options'});
    q.opts.forEach((o,i) => {
      const optEl = h('div', {class:'qz-opt'}, [o]);
      optEl.addEventListener('click', () => selectAnswer(i, q, qi, optEl));
      opts.appendChild(optEl);
    });
    wrap.appendChild(opts);

    state.questionStartAt = Date.now();
    clearQTimer();
    state.qTimerEpoch = (state.qTimerEpoch || 0) + 1;
    const myEpoch = state.qTimerEpoch;
    state.qTimer = setInterval(() => {
      if (state.qTimerEpoch !== myEpoch){ clearInterval(state.qTimer); return; }
      const elapsed = Date.now() - state.questionStartAt;
      const remain = Math.max(0, QUESTION_SECONDS*1000 - elapsed);
      const pct = remain / (QUESTION_SECONDS*1000);
      const ringEl = root.querySelector('#qz-qtimer .qz-timer-fg');
      const numEl = root.querySelector('#qz-qtimer-num');
      if (ringEl){
        ringEl.style.strokeDashoffset = circumference * (1-pct);
        ringEl.classList.toggle('qz-timer-urgent', remain <= 2000);
      }
      if (numEl) numEl.textContent = Math.ceil(remain/1000);
      if (remain <= 0 && !state.locked){
        selectAnswer(-1, q, qi, null);
      }
    }, 100);

    return wrap;
  }

  function selectAnswer(i, q, qi, optEl){
    if (qi !== state.qIndex) return;
    if (state.locked) return;
    state.locked = true; state.selectedIdx = i;
    clearQTimer();
    const correct = i === q.correct;
    if (correct) state.correctCount += 1;
    root.querySelectorAll('.qz-opt').forEach(e => e.classList.add('qz-disabled'));
    if (optEl) optEl.classList.add('qz-selected');

    setTimeout(() => {
      const currentScreen = root.querySelector('.qz-screen');
      if (currentScreen) currentScreen.classList.add('qz-exit');
      setTimeout(() => {
        const isLast = qi >= QUESTIONS.length - 1;
        if (isLast){
          const totalTimeMs = Date.now() - state.quizStartAt;
          const finalRecord = { name: state.name, correctCount: state.correctCount, totalTimeMs, finished: true, joinedAt: state.quizStartAt };
          state.totalTimeMs = totalTimeMs;
          state.view = 'finish'; render();
          apiPost({ action: 'upsert', playerId: state.playerId, ...finalRecord }).then(() => {
            apiVerifyPlayer(state.playerId, { correctCount: state.correctCount, finished: true }).then(verified => {
              if (!verified && state.view === 'finish'){ state.saveFailed = true; render(); }
            });
          });
        } else {
          state.qIndex += 1; state.selectedIdx = null; state.locked = false;
          state.view = 'question'; render();
          setPlayer(state.playerId, { name: state.name, correctCount: state.correctCount, totalTimeMs: 0, finished: false, joinedAt: state.quizStartAt });
        }
      }, 220);
    }, FEEDBACK_MS);
  }

  // ---------- FINISH: completion alert + warm closing message ----------
  function ScreenFinish(){
    const wrap = h('div', {class:'qz-screen'});
    const confettiBox = h('div', {class:'qz-confetti-container'});
    wrap.appendChild(confettiBox);
    wrap.appendChild(h('div', {class:'qz-alert-banner'}, ['🎉 סיימת את השאלון!']));
    wrap.appendChild(h('div', {class:'qz-title-main qz-font-display', style:'font-size:22px;'}, [esc(state.name) + ', תודה שהשתתפת']));
    if (state.saveFailed){
      wrap.appendChild(h('div', {class:'qz-warn-banner'}, ['⚠️ יש בעיה: ייתכן שהתוצאה שלך לא נשמרה. כדאי לספר למנחה ולנסות שוב אם אפשר.']));
    }
    wrap.appendChild(h('div', {class:'qz-final-msg', html:'מבטיחות שיהיה בסדר — כי נעשה שיהיה בסדר.<br>אוהבות, צוות פרודות | גרושות המילואימניקים 🩷'}));
    spawnConfetti(confettiBox);
    return wrap;
  }

  // ---------- HOST PIN GATE ----------
  function ScreenHostPin(){
    const wrap = h('div', {class:'qz-screen'});
    wrap.appendChild(h('div', {class:'qz-eyebrow'}, ['גישת מנחה']));
    wrap.appendChild(h('div', {class:'qz-title-main qz-font-display', style:'font-size:20px;'}, ['הזיני את קוד המנחה']));
    wrap.appendChild(h('div', {class:'qz-subtitle'}, ['מסך זה מרכז את תשובות כל המשתתפות ומכריז על המנצחת — למנחה בלבד']));
    const pinInput = h('input', {class:'qz-input', placeholder:'••••', maxlength:'6', type:'password', inputmode:'numeric'});
    wrap.appendChild(pinInput);
    const err = h('div', {class:'qz-error'});
    wrap.appendChild(err);
    wrap.appendChild(h('button', {class:'qz-btn', onclick: () => {
      if (pinInput.value.trim() === HOST_PIN){ state.view='results'; render(); }
      else { err.textContent = 'קוד שגוי'; }
    }}, ['כניסה']));
    wrap.appendChild(h('button', {class:'qz-reset-link', onclick: () => { state.view='start'; render(); }}, ['חזרה']));
    setTimeout(() => pinInput.focus(), 50);
    pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter'){
      if (pinInput.value.trim() === HOST_PIN){ state.view='results'; render(); } else { err.textContent = 'קוד שגוי'; }
    }});
    return wrap;
  }

  // ---------- Hidden results view for the organizer (?view=results) ----------
  function ScreenResults(){
    const wrap = h('div', {class:'qz-screen'});
    wrap.appendChild(h('div', {class:'qz-eyebrow'}, ['רשימת המשתתפות (למנחה)']));
    const announceBox = h('div', {id:'qz-announce', style:'display:flex; flex-direction:column; align-items:center; gap:10px;'});
    wrap.appendChild(announceBox);
    const lb = h('div', {class:'qz-leaderboard', id:'qz-lb-list'});
    wrap.appendChild(lb);
    renderAnnounce(announceBox);
    renderLeaderboardRows(lb);
    const resetBtn = h('button', {class:'qz-reset-link'}, ['איפוס רשימת המשתתפות']);
    let resetArmed = false;
    resetBtn.addEventListener('click', async () => {
      if (!resetArmed){
        resetArmed = true;
        resetBtn.textContent = 'בטוחה? לחצי שוב לאישור מחיקה';
        setTimeout(() => { resetArmed = false; resetBtn.textContent = 'איפוס רשימת המשתתפות'; }, 4000);
        return;
      }
      resetArmed = false;
      resetBtn.textContent = 'מאפסת...';
      await apiPost({ action: 'reset', pin: HOST_PIN });
      state.players = []; render();
    });
    wrap.appendChild(resetBtn);
    wrap.appendChild(h('button', {class:'qz-reset-link', onclick: () => { state.view='start'; render(); }}, ['חזרה']));
    refreshResults();
    setInterval(refreshResults, 2000);
    return wrap;
  }
  function renderAnnounce(container){
    container.innerHTML = '';
    const winner = state.players.find(p => p.finished && p.correctCount > QUESTIONS.length/2);
    if (winner){
      container.appendChild(h('div', {class:'qz-winner-ring'}, ['🏆']));
      container.appendChild(h('div', {class:'qz-title-main qz-font-display', style:'font-size:24px;'}, [esc(winner.name)]));
      container.appendChild(h('div', {class:'qz-subtitle'}, ['ענתה נכון על ' + winner.correctCount + ' מתוך ' + QUESTIONS.length + ' שאלות, בזמן ' + fmtTime(winner.totalTimeMs)]));
    } else {
      const stillPlaying = state.players.some(p => !p.finished);
      container.appendChild(h('div', {class:'qz-subtitle'}, [stillPlaying ? 'עדיין יש משתתפות שממשיכות לענות...' : 'עדיין אין מי שענתה נכון על רוב השאלות']));
    }
  }
  function renderLeaderboardRows(container){
    container.innerHTML = '';
    if (!state.players.length){ container.appendChild(h('div', {class:'qz-small'}, ['עדיין אין משתתפות ברשימה'])); return; }
    state.players.forEach((p,i) => {
      const isWinnerRow = i===0 && p.finished && p.correctCount > QUESTIONS.length/2;
      const row = h('div', {class:'qz-lb-row' + (isWinnerRow ? ' qz-lb-first' : '')});
      row.appendChild(h('div', {class:'qz-lb-rank'}, [String(i+1)]));
      row.appendChild(h('div', {class:'qz-lb-name'}, [esc(p.name)]));
      if (p.finished) row.appendChild(h('div', {class:'qz-lb-score'}, [p.correctCount + '/' + QUESTIONS.length + ' · ' + fmtTime(p.totalTimeMs)]));
      else row.appendChild(h('div', {class:'qz-lb-progress'}, ['משחקת כעת...']));
      container.appendChild(row);
    });
  }
  async function refreshResults(){
    if (state.view !== 'results') return;
    const players = await getAllPlayers();
    if (players === null) return; // fetch failed/timed out — keep showing the last known list
    const changed = JSON.stringify(players) !== JSON.stringify(state.players);
    state.players = players;
    if (!changed) return;
    const lb = root.querySelector('#qz-lb-list');
    if (lb) renderLeaderboardRows(lb);
    const announceBox = root.querySelector('#qz-announce');
    if (announceBox) renderAnnounce(announceBox);
  }

  const SCREENS = { 'welcome': ScreenWelcome, 'qr': ScreenQR, 'start': ScreenStart, 'presenter': ScreenPresenter, 'name': ScreenName, 'question': ScreenQuestion, 'finish': ScreenFinish, 'host-pin': ScreenHostPin, 'results': ScreenResults };

  function getUrlParam(name){
    try {
      const v = new URLSearchParams(window.location.search).get(name);
      if (v) return v;
    } catch(e){}
    try {
      const ref = document.referrer;
      if (ref){
        const v2 = new URL(ref).searchParams.get(name);
        if (v2) return v2;
      }
    } catch(e){}
    return null;
  }

  if (getUrlParam('view') === 'results') state.view = 'host-pin';
  else if (getUrlParam('join') === '1') state.view = 'name';

  render();
})();
</script>
