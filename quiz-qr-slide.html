<div id="qr-slide-root" dir="rtl" lang="he"></div>
<style>
  #qr-slide-root {
    --bg-deep: #241129;
    --bg-deep2: #341a3d;
    --purple: #7a3b82;
    --lavender: #c9a0dc;
    --pink: #f0a8c4;
    --gold: #e8b84b;
    --cream: #fbf3fa;
    --muted: #cbb3d1;
    font-family: 'Assistant', 'Heebo', sans-serif;
    position: relative;
    width: 100%;
    min-height: 640px;
    background:
      radial-gradient(circle at 20% 15%, rgba(240,168,196,0.18), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(232,184,75,0.12), transparent 40%),
      linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-deep2) 55%, #2c1533 100%);
    color: var(--cream);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 40px 26px;
    text-align: center;
    box-sizing: border-box;
  }
  #qr-slide-root * { box-sizing: border-box; }
  #qr-slide-root .qr-font-display { font-family: 'Heebo', sans-serif; font-weight: 900; }
  #qr-slide-root .qr-ring-wrap { position: relative; width: 120px; height: 120px; display:flex; align-items:center; justify-content:center; }
  #qr-slide-root .qr-ring-glow {
    position:absolute; inset:0; border-radius:50%;
    background: radial-gradient(circle, rgba(240,168,196,0.35), transparent 70%);
    filter: blur(6px);
    animation: qr-pulse 3s ease-in-out infinite;
  }
  @keyframes qr-pulse { 0%,100%{transform:scale(1); opacity:.8;} 50%{transform:scale(1.08); opacity:1;} }
  #qr-slide-root .qr-heartbeat { display:inline-block; animation: qr-heartbeat 2.4s ease-in-out infinite; }
  @keyframes qr-heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  #qr-slide-root .qr-eyebrow {
    font-size: 14px; letter-spacing: 3px; color: var(--pink); text-transform: uppercase; font-weight: 700;
  }
  #qr-slide-root .qr-title-main {
    font-size: 30px; line-height:1.3; color: var(--cream); max-width: 520px;
    text-shadow: 0 2px 18px rgba(240,168,196,0.35);
  }
  #qr-slide-root .qr-box {
    background: #fff; padding: 20px; border-radius: 22px; display:inline-flex; align-items:center; justify-content:center;
    box-shadow: 0 12px 36px rgba(0,0,0,0.4); border: 4px solid var(--gold);
  }
  #qr-slide-root .qr-hint { font-size: 18px; font-weight: 700; color: var(--gold); font-family:'Heebo'; }
  #qr-slide-root .qr-link-row { display:flex; align-items:center; gap:8px; width:100%; max-width: 420px; margin-top: 4px; }
  #qr-slide-root .qr-link-input {
    flex:1; font-size: 12px; padding: 9px 12px; border-radius: 10px; border: 1px solid rgba(201,160,220,0.35);
    background: rgba(255,255,255,0.06); color: var(--muted); text-align:center; font-family: inherit; direction: ltr;
  }
  #qr-slide-root .qr-go-btn {
    font-size: 12px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--lavender); background: transparent;
    color: var(--lavender); cursor: pointer; font-family: inherit;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  const root = document.getElementById('qr-slide-root');
  // Paste the published link of the main game artifact here:
  let gameUrl = 'https://perlovmaria-star.github.io/arev-hokara-quiz/';

  function h(tag, attrs, children){
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs){
      if (k === 'class') el.className = attrs[k];
      else if (k === 'style') el.setAttribute('style', attrs[k]);
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(c => { if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }

  function build(){
    root.innerHTML = '';
    root.appendChild(h('div', {class:'qr-ring-wrap'}, [
      h('div', {class:'qr-ring-glow'}),
      h('div', {class:'qr-font-display qr-heartbeat', style:'font-size:36px; z-index:1;'}, ['🩷'])
    ]));
    root.appendChild(h('div', {class:'qr-eyebrow'}, ['משחק פתיחה קהילתי']));
    root.appendChild(h('div', {class:'qr-title-main qr-font-display'}, ['מי באמת מבינה את החיים שלנו?']));
    const box = h('div', {class:'qr-box', id:'qr-box'});
    root.appendChild(box);
    root.appendChild(h('div', {class:'qr-hint'}, ['📱 סרקו כדי להצטרף למשחק']));

    if (!/^https?:\/\//.test(gameUrl)){
      box.appendChild(h('div', {style:'max-width:220px; font-size:13px; color:#241129;'}, ['הדביקו כאן את הקישור המפורסם של המשחק:']));
      const row = h('div', {class:'qr-link-row'});
      const input = h('input', {class:'qr-link-input', placeholder:'https://...'});
      row.appendChild(input);
      const btn = h('button', {class:'qr-go-btn'}, ['הצג']);
      btn.addEventListener('click', () => { const v = input.value.trim(); if (v){ gameUrl = v; build(); } });
      row.appendChild(btn);
      root.appendChild(row);
      return;
    }
    try {
      new QRCode(box, { text: gameUrl, width: 220, height: 220, colorDark: '#241129', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    } catch(e){}
  }

  build();
})();
</script>
